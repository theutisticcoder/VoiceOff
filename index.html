<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.3/client-dist/socket.io.min.js"></script>
     <title>VoiceOff</title>
</head>

<body>
     <h1>Broken Lit Mag Phone</h1>
     <div id="game"></div>
     <script>
     var host = false; 
          var name, rn;
          const socket = io();
          socket.on("connect", () => {
               var room = confirm("Create a room? Click 'cancel' to join an existing one.");
               if (room == true) {
                    rn = prompt("Create a room name");
               }
               else {
                    rn = prompt("Enter the room name")
               }
               name = prompt("Write your name");
               socket.emit("joined", [name, rn])
          });
          socket.on("player", p => {
               if (p.host == true) {
                    document.querySelector("#game").innerHTML += "<button id='sg'>Start Game</button>"
                    document.querySelector("#sg").onclick = (e) => {
                         alert("Starting Game");
                         socket.emit("start", p.room);
                         e.target.remove();
                    }
                    host = true
               }
               else {
                    document.querySelector("#game").innerHTML += "Game Awaiting Host."
               }

          })

          socket.on("textstart", () => {
               document.querySelector("#game").innerHTML = "";
               document.querySelector("#game").innerHTML += "<textarea placeholder='Write a passage in your own voice and topic. Limit: 3 sentences.'></textarea>";
               setTimeout(() => {
                    socket.emit("textsub", document.querySelector("textarea").value );
                    console.log( document.querySelector("textarea").value )
                    document.querySelector("textarea").remove()
                    if(host){
                         setTimeout(socket.emit('textcheck'),1000)
                    }
               }, 40000)

          })
          socket.on("text", (t) => {
               var d = t.text;
               var t1= t.t1;
               document.querySelector("#game").innerHTML = "Write based on this topic and voice: " + d;
               document.querySelector("#game").innerHTML += "<textarea placeholder='Write a passage in the voice and topic. Limit: 3 sentences.'></textarea>";
               setTimeout(() => {
                    socket.emit("textsub", {text: document.querySelector("textarea").value, t1: t1} );
                    console.log({text: document.querySelector("textarea").value, t1: t1} )
                    document.querySelector("textarea").remove()
                    if(host){
                         setTimeout(socket.emit('textcheck'),1000)
                    }
               }, 40000)

          })
        
          
          socket.on("voice", t => {
               var d = t.text;
               var t1= t.t1;
               document.querySelector("#game").innerHTML = "Descibe the voice and topic of this passage: " + d;
               document.querySelector("#game").innerHTML += "<textarea placeholder='Descibe the voice and topic. Limit: 3 sentences.'></textarea>";
               setTimeout(() => {
                    socket.emit("voicesub", {text: document.querySelector("textarea").value, t1: t1} );
                    console.log({text: document.querySelector("textarea").value, t1: t1} )
                    document.querySelector("textarea").remove()
                    if(host){
                         setTimeout(socket.emit('voicecheck'),1000)
                    }
               }, 40000)
          })
         

          socket.on('final', parts=> {
               parts.forEach(part=> {

                    document.querySelector("#game").innerHTML += "Original: " + part.text1 + "->";
                    document.querySelector("#game").innerHTML += "Description: " + part.voice1 + "->";
                    document.querySelector("#game").innerHTML += "New Writing: " + part.text2 + "->";
                    document.querySelector("#game").innerHTML += "Description: " + part.voice2 + "->";
                    document.querySelector("#game").innerHTML += "New Writing: " + part.text3 + "->";
                    document.querySelector("#game").innerHTML += "Description: " + part.voice3 + "->";
                    document.querySelector("#game").innerHTML += "New Writing: " + part.text4 + "->";
                    document.querySelector("#game").innerHTML += "Description: " + part.voice4 + "->";
                    document.querySelector("#game").innerHTML += "New Writing: " + part.text5 + "->";
                    document.querySelector("#game").innerHTML += "Description: " + part.voice5;
                    document.querySelector("#game").innerHTML += "<br><br><hr><br><br>";
                    
              })
          })
     </script>
</body>

</html>
