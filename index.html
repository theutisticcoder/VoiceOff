<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.3/client-dist/socket.io.min.js"></script>
     <title>VoiceOff</title>
</head>

<body>
     <h1>Broken Lit Mag Phone</h1>
     <div id="game"></div>
     <script>
          var name, rn;
          const socket = io();
          socket.on("connect", () => {
               var room = confirm("Create a room? Click 'cancel' to join an existing one.");
               if (room == true) {
                    rn = prompt("Create a room name");
               }
               else {
                    rn = prompt("Enter the room name")
               }
               name = prompt("Write your name");
               socket.emit("joined", [name, rn])
          });
          socket.on("player", p => {
               console.log(p);
               if (p.host == true) {
                    document.querySelector("#game").innerHTML += "<button id='sg'>Start Game</button>"
                    document.querySelector("#sg").onclick = () => {
                         alert("Starting Game");
                         socket.emit("start", p.room);
                    }
               }
               else {
                    document.querySelector("#game").innerHTML += "Game Awaiting Host."
               }

          })

          socket.on("text1", () => {
               document.querySelector("#game").innerHTML = "";
               document.querySelector("#game").innerHTML += "<textarea placeholder='Write a passage in your own voice and topic. Limit: 5 sentences.'></textarea>";
               setTimeout(() => {
                    socket.emit("text1sub", document.querySelector("textarea").innerHTML);

               }, 120000)

          })
          socket.on("voice1", p => {
               alert(p);
          })

     </script>
</body>

</html>
